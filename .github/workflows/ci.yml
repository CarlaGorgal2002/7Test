name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  backend-ci:
    name: Backend CI (Build, Test & Boot Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests with coverage check
        run: |
          ./mvnw clean verify

      - name: Start Spring Boot Application (Boot Check)
        run: |
          # We use an in-memory database to avoid directory permission issues in the CI environment
          nohup java -Dspring.datasource.url="jdbc:h2:mem:testdb" -jar target/7test-0.0.1-SNAPSHOT.jar > spring-boot.log 2>&1 &
          echo $! > spring-boot.pid

      - name: Verify Application Boot Status
        run: |
          echo "Waiting for Spring Boot to start and respond on port 8080..."
          success=false
          for i in {1..30}; do
            # We check the swagger-ui or the OpenAPI docs endpoint which are configured to permitAll()
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v3/api-docs || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Spring Boot started successfully and is responding with HTTP 200!"
              success=true
              break
            fi
            echo "Still waiting... (Attempt $i/30, HTTP Status: $HTTP_CODE)"
            sleep 2
          done
          
          # Check if the process died early
          if [ -f spring-boot.pid ]; then
            PID=$(cat spring-boot.pid)
            if ! kill -0 $PID 2>/dev/null; then
              echo "WARNING: Spring Boot process is no longer running!"
            fi
          fi

          if [ "$success" = false ]; then
            echo "Error: Application failed to start in the allotted time."
            echo "--- SPRING BOOT LOG OUTPUT ---"
            cat spring-boot.log
            exit 1
          fi

      - name: Stop Spring Boot Application
        if: always()
        run: |
          if [ -f spring-boot.pid ]; then
            PID=$(cat spring-boot.pid)
            echo "Stopping Spring Boot (PID: $PID)..."
            kill $PID || true
          fi

  frontend-ci:
    name: Frontend CI (Build Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
