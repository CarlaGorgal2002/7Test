name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write

jobs:
  ci-pipeline:
    name: Build, Test & Deploy Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm run test -- --reporter=json --outputFile=vitest-report.json

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Configure Maven for Spring snapshots
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>spring-snapshots</id>
                <repositories>
                  <repository>
                    <id>spring-snapshots</id>
                    <url>https://repo.spring.io/snapshot</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                  <repository>
                    <id>spring-milestones</id>
                    <url>https://repo.spring.io/milestone</url>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>spring-snapshots</id>
                    <url>https://repo.spring.io/snapshot</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                  <pluginRepository>
                    <id>spring-milestones</id>
                    <url>https://repo.spring.io/milestone</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>spring-snapshots</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build and Run Backend Tests with Coverage Check
        run: ./mvnw clean verify

      - name: Start Spring Boot Application (Boot Check)
        run: |
          nohup java -Dspring.datasource.url="jdbc:h2:mem:testdb" -jar target/7test-0.0.1-SNAPSHOT.jar > spring-boot.log 2>&1 &
          echo $! > spring-boot.pid

      - name: Verify Application Boot Status
        run: |
          echo "Waiting for Spring Boot to start and respond on port 8080..."
          success=false
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v3/api-docs || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Spring Boot started successfully and is responding with HTTP 200!"
              success=true
              break
            fi
            echo "Still waiting... (Attempt $i/30, HTTP Status: $HTTP_CODE)"
            sleep 2
          done
          
          # Check if the process died early
          if [ -f spring-boot.pid ]; then
            PID=$(cat spring-boot.pid)
            if ! kill -0 $PID 2>/dev/null; then
              echo "WARNING: Spring Boot process is no longer running!"
            fi
          fi

          if [ "$success" = false ]; then
            echo "Error: Application failed to start in the allotted time."
            echo "--- SPRING BOOT LOG OUTPUT ---"
            cat spring-boot.log
            exit 1
          fi

      - name: Stop Spring Boot Application
        if: always()
        run: |
          if [ -f spring-boot.pid ]; then
            PID=$(cat spring-boot.pid)
            echo "Stopping Spring Boot (PID: $PID)..."
            kill $PID || true
          fi

      - name: Generate Testing Dashboard
        if: always()
        run: python3 scripts/generate_ci_dashboard.py >> $GITHUB_STEP_SUMMARY

      - name: Deploy Coverage Report to GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/jacoco
