version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seventest
      POSTGRES_USER: seventest_user
      POSTGRES_PASSWORD: seventest_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seventest_user -d seventest"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/seventest
      SPRING_DATASOURCE_USERNAME: seventest_user
      SPRING_DATASOURCE_PASSWORD: seventest_pass
      JWT_SECRET: clave-segura-para-desarrollo-local-minimo-32-chars
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
