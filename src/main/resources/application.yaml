spring:
  application:
    name: 7test
  datasource:
    url: jdbc:h2:file:/app/data/seventest;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-minimo-256-bits-de-longitud}
    expiration-ms: 3600000
  security:
    max-login-attempts: 9999
    lockout-duration-minutes: 0
