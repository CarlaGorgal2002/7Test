spring:
  application:
    name: 7test
  datasource:
    url: jdbc:h2:mem:seventest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-minimo-256-bits-de-longitud}
    expiration-ms: 3600000
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
