spring:
  application:
    name: 7test
  datasource:
    url: jdbc:h2:file:/app/data/seventest;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-minimo-256-bits-de-longitud}
    expiration-ms: 3600000
  security:
    max-login-attempts: 9999
    lockout-duration-minutes: 0
  ai-grading:
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    material-version: testing-apps-2026-06-10-v1
    material-resource: classpath:course-material/Todo_Testing_de_Apps.pdf
    material-sha256: FC7D8DA8052D96C2A3727DE4B4DFE91E93412F4B664EB8B2E31CDE5CC8E9DFF0
    prompt-version: testing-grading-v2
    prompt-resource: classpath:ai-grading/testing-grading-v2.txt
    max-relevant-pages: ${OPENAI_MAX_RELEVANT_PAGES:8}
    max-characters-per-page: ${OPENAI_MAX_CHARACTERS_PER_PAGE:6000}
